# Projet Xcode de Pulse, décrit pour XcodeGen.
# « xcodegen generate » produit Pulse.xcodeproj (non versionné).

name: Pulse

options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    # La version de Pulse (app et widget), à augmenter pour chaque release.
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Signature avec le compte Apple gratuit (Personal Team) : macOS exige
    # une identité de développeur pour l'App Group partagé avec le widget.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: 79W4JUNG7Y
    # Les scripts de build écrivent dans core/target et app/Sources.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Le module C « pulse_coreFFI » (en-tête + module.modulemap générés par UniFFI).
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/app/Sources/pulse_coreFFI

targets:
  # Les bindings Swift générés par UniFFI, au-dessus de la lib Rust.
  PulseCore:
    type: library.static
    platform: macOS
    sources:
      # Généré par la phase ci-dessous : peut manquer avant le premier build.
      - path: app/Sources/PulseCore/pulse_core.swift
        optional: true
    preBuildScripts:
      - name: Cœur Rust et bindings UniFFI
        script: '"${SRCROOT}/scripts/build-core.sh"'
        # Toujours lancé : cargo ne recompile que ce qui a changé.
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/app/Sources/PulseCore/pulse_core.swift
          - $(SRCROOT)/app/Sources/pulse_coreFFI/pulse_coreFFI.h
          - $(SRCROOT)/app/Sources/pulse_coreFFI/module.modulemap
          - $(SRCROOT)/core/target/universal/release/libpulse_core.a

  # L'app de barre des menus.
  Pulse:
    type: application
    platform: macOS
    sources:
      - path: app/Sources/Pulse
      # Le format du fichier partagé avec le widget.
      - path: app/Sources/Shared
      - path: build/AppIcon.icns
        optional: true
        buildPhase: resources
    dependencies:
      - target: PulseCore
      # Intégré dans Pulse.app/Contents/PlugIns.
      - target: PulseWidget
    entitlements:
      path: app/Pulse.entitlements
      properties:
        # Le conteneur partagé avec le widget, préfixé par le Team ID comme
        # l'exige macOS sans compte payant. L'app n'est pas sandboxée.
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)ch.latifcodess.pulse
    preBuildScripts:
      - name: Icône de l'app
        script: '"${SRCROOT}/scripts/build-icon.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/build/AppIcon.icns
    settings:
      base:
        PRODUCT_NAME: Pulse
        PRODUCT_BUNDLE_IDENTIFIER: ch.latifcodess.pulse
        # Info.plist existant : LSUIElement (pas d'icône dans le Dock), version…
        INFOPLIST_FILE: app/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Pas de sandbox : Pulse lit ~/.codex et ~/.gemini, et lance gh.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # La lib statique du cœur Rust (universelle, produite par build-core.sh).
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/core/target/universal/release
        OTHER_LDFLAGS: -lpulse_core
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          # Comme les builds précédents (SwiftPM) : pas de droit de débogage,
          # code inutilisé et symboles retirés du binaire.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          DEAD_CODE_STRIPPING: YES
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
    scheme: {}

  # Le widget (WidgetKit) : il ne lit que le fichier écrit par l'app dans le
  # conteneur de l'App Group, sans réseau ni Trousseau.
  PulseWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: app/Sources/PulseWidget
      - path: app/Sources/Shared
      - path: app/Sources/Pulse/ServiceLogo.swift
    info:
      path: app/PulseWidget-Info.plist
      properties:
        CFBundleDisplayName: Pulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        # Le nom complet de l'App Group, lu par le code (voir WidgetSnapshot).
        PulseAppGroup: $(TeamIdentifierPrefix)ch.latifcodess.pulse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: app/PulseWidget.entitlements
      properties:
        # Les widgets doivent être sandboxés.
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)ch.latifcodess.pulse
    settings:
      base:
        PRODUCT_NAME: PulseWidget
        PRODUCT_BUNDLE_IDENTIFIER: ch.latifcodess.pulse.widget
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          DEAD_CODE_STRIPPING: YES
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
